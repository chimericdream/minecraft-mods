// Run-task shutdown watchdog.
//
// Dev-environment `run*` tasks (NeoForge runData/runClient/runServer, Fabric runGameTest, ...) can finish
// all of their real work and then never exit, because a dependency leaves non-daemon executor threads
// alive (see docs/MC-26.2-NOTES.md, "Build/datagen/GameTest tasks can hang after finishing"). Nothing
// kills them, so a build can sit for an hour.
//
// This script watches the forked JVM's output for a "finished" sentinel:
//
//     NeoForge:   "Closing FML Loader" / "Clearing ModLoader"   (logged as the last thing on shutdown)
//     Fabric:     "All N required tests passed"                 (runGameTest)
//
// If the JVM is still alive `watchdog.graceSeconds` (default 30) after the sentinel, the JVM and its
// descendants (including any Architectury TransformerRuntime it spawned, which otherwise keeps the dev
// jar locked) are force-killed. The task is then treated as successful IF the sentinel proves it finished
// (see `isCleanFinish`); a JVM that exits non-zero on its own, or is killed without a clean sentinel,
// still fails the task exactly as before.
//
// All state lives in a build service (not script-level variables) and end-of-build cleanup is the
// service's close(), so this script is compatible with the configuration cache.
//
// Opt out with -Pwatchdog=false. Tune the grace period with -Pwatchdog.graceSeconds=60.
import javax.inject.Inject
import org.gradle.api.logging.Logger
import org.gradle.api.provider.Property
import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters
import org.gradle.build.event.BuildEventsListenerRegistry
import org.gradle.tooling.events.FinishEvent
import org.gradle.tooling.events.OperationCompletionListener

if (findProperty('watchdog') == 'false') {
    return
}

// Watches a stream's text for sentinels, passing every byte through untouched.
class SentinelOutputStream extends OutputStream {
    final OutputStream delegate
    final Closure onLine
    final StringBuilder line = new StringBuilder()

    SentinelOutputStream(OutputStream delegate, Closure onLine) {
        this.delegate = delegate
        this.onLine = onLine
    }

    @Override
    void write(int b) {
        delegate.write(b)
        scan((char) (b & 0xFF))
    }

    @Override
    void write(byte[] b, int off, int len) {
        delegate.write(b, off, len)
        for (int i = off; i < off + len; i++) {
            scan((char) (b[i] & 0xFF))
        }
    }

    @Override
    void flush() {
        delegate.flush()
    }

    private void scan(char c) {
        if (c == (char) '\n') {
            flushLine()
        } else if (line.length() < 4096) {
            line.append(c)
        }
    }

    private void flushLine() {
        String text = line.toString()
        line.setLength(0)
        try {
            onLine(text)
        } catch (Throwable ignored) {
            // The watchdog must never break the task's output pipe.
        }
    }
}

interface RunWatchdogParameters extends BuildServiceParameters {
    Property<Long> getGraceMillis()
}

// The listener side is a no-op: implementing OperationCompletionListener and registering it is what
// guarantees the service is instantiated (and therefore closed at the end of the build) even when no
// run task uses it.
abstract class RunWatchdogService implements BuildService<RunWatchdogParameters>, OperationCompletionListener, AutoCloseable {
    static final List<String> SENTINELS = ['Closing FML Loader', 'Clearing ModLoader']
    static final java.util.regex.Pattern PASS_MARKER = ~/All \d+ required tests passed/

    // Task path -> state, guarded by `this`. Deliberately not private: Groovy closures cannot read
    // private members when `this` is Gradle's generated subclass of the service, and the failure is
    // swallowed by SentinelOutputStream, which silently disables the watchdog.
    final Map<String, String> sentinelSeen = [:]   // task path -> sentinel text that was matched
    final Map<String, Boolean> killedTasks = [:]   // task path -> true once the watchdog killed the JVM
    final Map<String, Boolean> passedMarker = [:]  // task path -> true once a "tests passed" line was seen

    @Override
    void onFinish(FinishEvent event) {
    }

    // The forked JVM's children of this Gradle daemon that look like the run for a task, matched by the
    // mod / sub-project directories on their command line.
    static List<ProcessHandle> findRunJvms(List<String> needles) {
        def children = ProcessHandle.current().children().filter { it.isAlive() }.toList()
        def javas = children.findAll { ph ->
            def cmd = ph.info().command().orElse('')
            cmd.toLowerCase().contains('java') && !ph.info().commandLine().orElse('').contains('GradleWorkerMain')
        }
        def matched = javas.findAll { ph ->
            def line = ph.info().commandLine().orElse('') + ' ' + ph.info().arguments().map { it.join(' ') }.orElse('')
            needles.any { line.contains(it) }
        }
        if (matched) {
            return matched
        }
        // Only fall back when the single candidate's command line is unreadable. A readable command
        // line that matched no needle belongs to another (parallel) run task, and killing it would
        // fail that task; if our own JVM already exited there is simply nothing to kill.
        if (javas.size() == 1 && javas[0].info().commandLine().orElse('').isEmpty()
                && javas[0].info().arguments().isEmpty()) {
            return javas
        }
        return []
    }

    static void killTree(ProcessHandle root) {
        root.descendants().forEach { it.destroyForcibly() }
        root.destroyForcibly()
    }

    // Wraps the task's stdout/stderr so a sentinel line arms a kill timer. `needles` are the directories
    // used to recognise the task's JVM; they are computed at configuration time.
    void install(JavaExec task, String taskPath, List<String> needles) {
        // The watchdog decides pass/fail itself in checkExit (the task's doLast).
        task.ignoreExitValue = true

        long graceMillis = parameters.graceMillis.get()
        Logger logger = task.logger
        def armed = new java.util.concurrent.atomic.AtomicBoolean(false)
        def onLine = { String text ->
            def hit = SENTINELS.find { text.contains(it) }
            if (PASS_MARKER.matcher(text).find()) {
                synchronized (this) { passedMarker[taskPath] = true }
                hit = hit ?: 'tests passed'
            }
            if (hit == null || !armed.compareAndSet(false, true)) {
                return
            }
            synchronized (this) { sentinelSeen[taskPath] = hit }

            def watcher = new Thread({
                Thread.sleep(graceMillis)
                def jvms = findRunJvms(needles)
                if (jvms.isEmpty()) {
                    return // exited on its own within the grace period
                }
                synchronized (this) { killedTasks[taskPath] = true }
                logger.lifecycle("[watchdog] ${taskPath}: JVM still alive ${graceMillis / 1000}s after '${hit}'; killing it.")
                jvms.each { killTree(it) }
            } as Runnable, "run-watchdog ${taskPath}")
            watcher.daemon = true
            watcher.start()
        }

        task.standardOutput = new SentinelOutputStream(task.standardOutput ?: System.out, onLine)
        task.errorOutput = new SentinelOutputStream(task.errorOutput ?: System.err, onLine)
    }

    void checkExit(String taskPath, String taskName, int exit, Logger logger) {
        if (exit == 0) {
            return
        }

        boolean killed, finished
        boolean passed
        synchronized (this) {
            killed = killedTasks[taskPath] == true
            finished = sentinelSeen[taskPath] != null
            passed = passedMarker[taskPath] == true
        }

        // Killed by the watchdog after a clean finish: success. For test runs, "finished" must also
        // mean the tests passed -- a hung run whose tests failed must still fail.
        boolean isTestRun = taskName.toLowerCase().contains('gametest')
        boolean isCleanFinish = killed && finished && (!isTestRun || passed)
        if (isCleanFinish) {
            logger.lifecycle("[watchdog] ${taskPath}: treating watchdog kill as success (run had already finished).")
            return
        }

        throw new GradleException("Process '${taskPath}' finished with non-zero exit value ${exit}")
    }

    // After the build, reap Architectury TransformerRuntime JVMs that are still descended from this Gradle
    // daemon; left alive they keep the dev jar locked and break the next run. Only our own descendants.
    @Override
    void close() {
        try {
            ProcessHandle.current().descendants()
                .filter { it.isAlive() && it.info().commandLine().orElse('').contains('dev.architectury.transformer.TransformerRuntime') }
                .forEach { it.destroyForcibly() }
        } catch (Throwable ignored) {
        }
    }
}

interface RunWatchdogInjected {
    @Inject
    BuildEventsListenerRegistry getListenerRegistry()
}

def runWatchdog = gradle.sharedServices.registerIfAbsent('runWatchdog', RunWatchdogService) {
    parameters.graceMillis.set(((findProperty('watchdog.graceSeconds') ?: '30') as long) * 1000L)
}
project.objects.newInstance(RunWatchdogInjected).listenerRegistry.onTaskCompletion(runWatchdog)

allprojects {
    tasks.configureEach { Task task ->
        if (!(task instanceof JavaExec) || !task.name.startsWith('run')) {
            return
        }

        task.usesService(runWatchdog)

        def taskPath = task.path
        def taskName = task.name
        def modDir = (task.project.parent == rootProject ? task.project.projectDir : task.project.parent.projectDir)
        def needles = [modDir.absolutePath, task.project.projectDir.absolutePath]

        task.doFirst { Task t ->
            runWatchdog.get().install((JavaExec) t, taskPath, needles)
        }

        task.doLast { Task t ->
            def exit = ((JavaExec) t).executionResult.get().exitValue
            runWatchdog.get().checkExit(taskPath, taskName, exit, t.logger)
        }
    }
}
