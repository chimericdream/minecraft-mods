// Shared build conventions for every mod in this monorepo. Applied from each mod's build.gradle via
//   apply from: "${rootDir}/gradle/mod-conventions.gradle"
// It runs in the mod project's context, so here `project` is the mod (e.g. :minekea) and its
// subprojects are common/fabric/neoforge. Per-mod values (mod_id, mod_version, maven_group,
// archives_name, the *_compat versions) come from the mod's own gradle.properties, which its
// common/fabric/neoforge subprojects inherit.
//
// The root build.gradle owns everything that is identical across every subproject regardless of mod
// (loom, java, repositories, the chimeric-lib dependency, publishing). This file owns the parts that
// are per-mod but structurally identical: coordinates, archive naming, mod-metadata token expansion,
// and the shadow "raw jar -> shadowJar" reclassification.

allprojects {
    group = project.maven_group
    version = "${rootProject.minecraft_compatibility}-${project.mod_version}"
}

subprojects {
    base {
        archivesName = "${project.archives_name}-${project.name}"
    }

    architectury {
        platformSetupLoomIde()
    }

    processResources {
        inputs.property 'version', project.version

        // Build the fabric.mod.json / neoforge.mods.toml token map from the mod's own properties, so
        // this one script works for every mod no matter which *_compat keys it declares (e.g. only
        // guide mods have patchouli_compat). `version` is the computed project version, not a raw
        // property. Extra keys are harmless; expand only fails on tokens it cannot resolve.
        def tokens = [version: project.version]
        project.properties.each { k, v ->
            if (k.endsWith('_compat') || k in ['mod_id', 'mod_name', 'mod_description']) {
                tokens[k] = v
            }
        }

        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
            expand(tokens)
        }

        // Fabric only applies an access widener at runtime if fabric.mod.json names it. The committed
        // file deliberately omits the field (it breaks the IDE when declared alongside Loom's
        // accessWidenerPath), and `bun run build` adds it transiently. Add it here too so a plain
        // `./gradlew` build (e.g. publishCurseforge) produces a working jar. Idempotent: skipped if the
        // source file already has the field.
        if (project.name == 'fabric') {
            def awName = "${project.mod_id}.accesswidener".toString()
            def awFile = project.parent.file("common/src/main/resources/${awName}")
            def modJsonFile = project.file('src/main/resources/fabric.mod.json')
            inputs.property 'accessWidener', awFile.exists()
            if (awFile.exists() && modJsonFile.exists() && !modJsonFile.text.contains('"accessWidener"')) {
                filesMatching('fabric.mod.json') {
                    filter { String line ->
                        line.matches(/^\s*"depends"\s*:.*/) ? line.replaceFirst(/^(\s*)/, '$1"accessWidener": "' + awName + '",\n$1') : line
                    }
                }
            }
        }
    }

    // The platform subprojects (fabric/neoforge) bundle their common code with the Shadow plugin.
    // Reclassify the plain `jar` as "raw" and let `shadowJar` produce the real, unclassified artifact
    // (mixin resources + shaded common classes). common is never shadowed.
    if (project.name != 'common') {
        apply plugin: 'com.gradleup.shadow'

        configurations {
            common {
                canBeResolved = true
                canBeConsumed = false
            }
            compileClasspath.extendsFrom common
            runtimeClasspath.extendsFrom common

            // Files in this configuration will be bundled into your mod using the Shadow plugin.
            // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
            shadowBundle {
                canBeResolved = true
                canBeConsumed = false
            }
        }

        jar {
            archiveClassifier = "raw"
        }

        shadowJar {
            dependsOn(jar)
            mainSpec.sourcePaths.clear()
            from(zipTree(jar.archiveFile))

            configurations = [project.configurations.shadowBundle]
            archiveClassifier = null
        }
    }
}

// CurseForge publishing. Opt-in per mod: a mod publishes only when its gradle.properties sets
// `curseforge_project_id`. One file per loader (the shadowJar), named "[Fabric] 26.2-1.2.0". Run with
//   ./gradlew :<mod>:fabric:publishCurseforge :<mod>:neoforge:publishCurseforge
// Add `-Ppublish_dry_run` to build the upload request without sending it. The API token is read from
// `curseforge_token` in ~/.gradle/gradle.properties (never commit it). Optional per-mod overrides
// (curseforge_environment, curseforge_requires, curseforge_optional) are documented in the mod template.
if (project.hasProperty('curseforge_project_id')) {
    subprojects {
        if (project.name == 'common') return

        apply plugin: 'me.modmuss50.mod-publish-plugin'

        def loaderId = project.name // 'fabric' | 'neoforge'
        def loaderTitle = loaderId == 'neoforge' ? 'NeoForge' : 'Fabric'
        def mcVersion = rootProject.minecraft_compatibility
        def modVersion = project.mod_version

        // The changelog section whose heading is "### <mc> - <version>", up to the next "### " heading.
        def changelogFile = project.parent.file('CHANGELOG.md')
        def releaseNotes = {
            if (!changelogFile.exists()) return ''
            def m = changelogFile.text =~ /(?ms)^### \Q${mcVersion} - ${modVersion}\E[ 	]*\R(.*?)(?=^### |\z)/
            return m.find() ? m.group(1).trim() : ''
        }

        publishMods {
            file = tasks.named('shadowJar').flatMap { it.archiveFile }
            displayName = "[${loaderTitle}] ${mcVersion}-${modVersion}".toString()
            version = "${mcVersion}-${modVersion}".toString()
            changelog = providers.provider(releaseNotes)
            type = modVersion =~ /-(alpha|beta)/ ? (modVersion.contains('-alpha') ? ALPHA : BETA) : STABLE
            modLoaders.add(loaderId)
            dryRun = providers.gradleProperty('publish_dry_run').isPresent()

            curseforge {
                projectId = project.curseforge_project_id
                accessToken = providers.gradleProperty('curseforge_token')
                minecraftVersions.add(mcVersion)
                javaVersions.add(JavaVersion.VERSION_25)

                // CurseForge rejects uploads with no environment tag. Default is both sides; a mod that is
                // client-only or server-only sets `curseforge_environment = client|server` in its
                // gradle.properties.
                def environment = project.findProperty('curseforge_environment') ?: 'both'
                clientRequired = environment in ['both', 'client']
                serverRequired = environment in ['both', 'server']

                // Dependencies, as CurseForge project slugs. Defaults match the mod template; a mod overrides
                // a whole list with a comma-separated `curseforge_requires` / `curseforge_optional` in its
                // gradle.properties (empty value = none). On Fabric, fabric-api (required) and modmenu (optional) are
                // always added; Mod Menu has no NeoForge version.
                def slugs = { String key, String fallback ->
                    // An explicitly empty value means "none", so only fall back when the property is unset.
                    def raw = project.findProperty(key)
                    ((raw == null ? fallback : raw) as String).split(',')*.trim().findAll { it }
                }
                def required = new LinkedHashSet(slugs('curseforge_requires', 'architectury-api,yacl,chimericlib'))
                def optionalDeps = new LinkedHashSet(slugs('curseforge_optional', ''))
                if (loaderId == 'fabric') {
                    required.add('fabric-api')
                    optionalDeps.add('modmenu')
                }
                // chimeric-lib is itself the default "chimericlib" dependency; it must never depend on itself.
                if (project.parent.name == 'chimeric-lib') {
                    required.remove('chimericlib')
                    optionalDeps.remove('chimericlib')
                }
                required.each { requires(it) }
                optionalDeps.each { optional(it) }
            }
        }
    }
}
