import org.gradle.jvm.tasks.Jar

plugins {
    id 'com.gradleup.shadow'
}

architectury {
    neoForge()
}

loom {
    accessWidenerPath = project(":effective-gear:common").loom.accessWidenerPath

    neoForge {
        convertAccessWideners(tasks.named("shadowJar", Jar), "effectivegear.accesswidener")
    }

    runs {
        data {
            serverData()
            name "Data Generation"
            programArgs(
                '--mod', mod_id,
                '--all',
                '--output', project(':effective-gear:common').file("src/main/generated").absolutePath,
                '--existing', project(':effective-gear:common').file("src/main/resources").absolutePath
            )
            runDir "build/datagen"
        }
    }
}

configurations {
    developmentNeoForge.extendsFrom common
}

dependencies {
    common(project(path: ':effective-gear:common')) { transitive false }
    shadowBundle project(path: ':effective-gear:common', configuration: 'transformProductionNeoForge')
}
