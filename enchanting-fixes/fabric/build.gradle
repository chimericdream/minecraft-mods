architectury {
    fabric()
}

loom {
    accessWidenerPath = project(":enchanting-fixes:common").loom.accessWidenerPath
}

configurations {
    developmentFabric.extendsFrom common
}

def opusProps = new Properties()
rootProject.file('opus/gradle.properties').withReader { opusProps.load(it) }
def opusVersion = "${rootProject.minecraft_compatibility}-${opusProps.getProperty('mod_version')}"

dependencies {
    common(project(path: ':enchanting-fixes:common')) { transitive false }
    // The guide book is Opus data and Opus is an optional dependency, so it is only on the dev runtime classpath. It is
    // wired as a built jar rather than project(): referencing :opus:common from here evaluates it too early.
    runtimeOnly files("${rootDir}/opus/fabric/build/libs/opus-fabric-${opusVersion}.jar") {
        builtBy ':opus:fabric:shadowJar'
    }
    shadowBundle project(path: ':enchanting-fixes:common', configuration: 'transformProductionFabric')
}

// The Advanced Silk Touch data pack is off by default, and the GameTest server has no way to turn it on. The test mod
// ships the pack data instead, so the enchantment is always in the GameTest registries.
tasks.named('processGametestResources') {
    from(project(':enchanting-fixes:common').file('src/main/resources/resourcepacks/advanced_silk_touch')) {
        include 'data/**'
    }
}
