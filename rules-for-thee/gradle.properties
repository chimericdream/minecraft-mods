# Mod properties
mod_id = rulesforthee
mod_name = Rules for Thee
mod_description = Per-player game rules for shared servers: give individual players or named profiles their own value for a game rule wherever the rule is about that player.
mod_version = 1.0.0-beta.0
maven_group = com.chimericdream.rulesforthee
archives_name = rulesforthee
enabled_platforms = fabric,neoforge

# Compatibility versions
minecraft_compat = 26.2

# CurseForge publishing (opt-in). Uncomment curseforge_project_id to enable the publishCurseforge tasks;
# the rest are overrides for the defaults. Lists are comma-separated CurseForge project slugs.
# curseforge_project_id =
# Default: both. Use client or server for a mod that only runs on one side.
# Server-side only: vanilla clients can join. Single-player still works (integrated server).
curseforge_environment = server
# Default: architectury-api,yacl,chimericlib. Empty = none. (fabric-api is always added on Fabric.)
curseforge_requires = architectury-api,chimericlib
# Default: none. Use `opus` if the mod's guide book is optional. (modmenu is always added on Fabric.)
# curseforge_optional = opus
