architectury {
    fabric()
}

loom {
    accessWidenerPath = project(":villager-tweaks:common").loom.accessWidenerPath

    runs {
        datagen {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(':villager-tweaks:common').file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            runDir "build/datagen"
        }
    }
}

configurations {
    developmentFabric.extendsFrom common
}

dependencies {
    common(project(path: ':villager-tweaks:common')) { transitive false }
    shadowBundle project(path: ':villager-tweaks:common', configuration: 'transformProductionFabric')
}
