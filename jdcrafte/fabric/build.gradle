architectury {
    fabric()
}

loom {
    accessWidenerPath = project(":jdcrafte:common").loom.accessWidenerPath

    runs {
        datagen {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(':jdcrafte:common').file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            runDir "build/datagen"
        }
    }
}

configurations {
    developmentFabric.extendsFrom common
}

def opusProps = new Properties()
rootProject.file('opus/gradle.properties').withReader { opusProps.load(it) }
def opusVersion = "${rootProject.minecraft_compatibility}-${opusProps.getProperty('mod_version')}"

dependencies {
    common(project(path: ':jdcrafte:common')) { transitive false }

    // The guide book is Opus data, so Opus is only needed at runtime (the jars declare the dependency). It is
    // wired as a built jar rather than project(): referencing :opus:common from here evaluates it too early.
    runtimeOnly files("${rootDir}/opus/fabric/build/libs/opus-fabric-${opusVersion}.jar") {
        builtBy ':opus:fabric:shadowJar'
    }
    shadowBundle project(path: ':jdcrafte:common', configuration: 'transformProductionFabric')
}
