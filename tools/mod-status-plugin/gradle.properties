# IntelliJ SDK. Point this at the *installation* directory (the one containing build.txt).
# Comment the line out to fall back to downloading IntelliJ IDEA Ultimate 2026.2.1 instead.
localIdePath = C:/Users/bill/AppData/Local/Programs/IntelliJ IDEA

pluginVersion = 1.2.0
