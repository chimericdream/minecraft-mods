# Avast's "Web/Mail Shield" intercepts HTTPS on this machine and re-signs it with a root CA that
# lives in the Windows certificate store but not in the JDK's cacerts, so every JVM download fails
# with "PKIX path validation failed: Path does not chain with any of the trust anchors". Telling the
# daemon to trust the Windows store (which already has that root) fixes dependency resolution.
# Drop this line on a machine without TLS-scanning antivirus.
org.gradle.jvmargs = -Xmx2G -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT

org.gradle.parallel = true
org.gradle.caching = true

# Build against the IDE that is already installed on this machine instead of downloading a ~2 GB
# IntelliJ SDK. Point this at the *installation* directory (the one containing build.txt).
# Comment the line out to fall back to downloading IntelliJ IDEA Ultimate 2026.2.1 instead.
localIdePath = C:/Users/bill/AppData/Local/Programs/IntelliJ IDEA

pluginVersion = 1.0.0
