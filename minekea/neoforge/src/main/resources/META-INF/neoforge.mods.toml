modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/chimericdream/minekea-fabric/issues"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "chimericdream"
description = '''
${mod_description}
'''
#logoFile = ""

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_compat},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_compat},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "chimericlib"
type = "required"
versionRange = "[${chimericlib_compat},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "yet_another_config_lib_v3"
type = "required"
versionRange = "[${yacl_compat},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "opus"
type = "optional"
versionRange = "[${opus_compat},)"
ordering = "AFTER"
side = "BOTH"

# Cobblicious provides some blocks that Minekea used to add. Minekea loads after it so it can see them.
[[dependencies.${mod_id}]]
modId = "cobblicious"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "minekea.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"
