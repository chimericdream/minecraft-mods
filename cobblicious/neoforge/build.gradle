import org.gradle.jvm.tasks.Jar

plugins {
    id 'com.gradleup.shadow'
}

architectury {
    neoForge()
}

loom {
    accessWidenerPath = project(":cobblicious:common").loom.accessWidenerPath

    neoForge {
        convertAccessWideners(tasks.named("shadowJar", Jar), "cobblicious.accesswidener")
    }
}

configurations {
    developmentNeoForge.extendsFrom common
}

dependencies {
    common(project(path: ':cobblicious:common')) { transitive false }

    // Forwarding Address is an optional dependency. Its migrations apply only when it is installed.
    common(project(path: ':forwarding-address:common')) { transitive false }
    implementation(project(path: ':forwarding-address:neoforge')) { transitive false }
    shadowBundle project(path: ':cobblicious:common', configuration: 'transformProductionNeoForge')
}
