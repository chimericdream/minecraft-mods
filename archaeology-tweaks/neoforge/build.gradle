import org.gradle.jvm.tasks.Jar

plugins {
    id 'com.gradleup.shadow'
}

architectury {
    neoForge()
}

loom {
    accessWidenerPath = project(":archaeology-tweaks:common").loom.accessWidenerPath

    neoForge {
        convertAccessWideners(tasks.named("shadowJar", Jar), "archtweaks.accesswidener")
    }

    runs {
        data {
            serverData()
            name "Data Generation"
            programArgs(
                '--mod', mod_id,
                '--all',
                '--output', project(':archaeology-tweaks:common').file("src/main/generated").absolutePath,
                '--existing', project(':archaeology-tweaks:common').file("src/main/resources").absolutePath
            )
            runDir "build/datagen"
        }
    }
}

configurations {
    developmentNeoForge.extendsFrom common
}

def opusProps = new Properties()
rootProject.file('opus/gradle.properties').withReader { opusProps.load(it) }
def opusVersion = "${rootProject.minecraft_compatibility}-${opusProps.getProperty('mod_version')}"

dependencies {
    common(project(path: ':archaeology-tweaks:common')) { transitive false }

    // The guide book is Opus data, so Opus is only needed at runtime (the jars declare the dependency). It is
    // wired as a built jar rather than project(): referencing :opus:common from here evaluates it too early.
    runtimeOnly files("${rootDir}/opus/neoforge/build/libs/opus-neoforge-${opusVersion}.jar") {
        builtBy ':opus:neoforge:shadowJar'
    }
    shadowBundle project(path: ':archaeology-tweaks:common', configuration: 'transformProductionNeoForge')
}
