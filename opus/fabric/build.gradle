architectury {
    fabric()
}

loom {
    accessWidenerPath = project(":opus:common").loom.accessWidenerPath
}

configurations {
    developmentFabric.extendsFrom common
}

dependencies {
    common(project(path: ':opus:common')) { transitive false }
    shadowBundle project(path: ':opus:common', configuration: 'transformProductionFabric')
}

// Bundles the Markdown/YAML parsers into the shipped jar, relocated so they cannot clash with another mod
// bundling its own copy. shadowJar output verified to contain only relocated classes.
repositories {
    mavenCentral()
}

dependencies {
    implementation "org.commonmark:commonmark:${project.commonmark_version}"
    implementation "org.commonmark:commonmark-ext-gfm-tables:${project.commonmark_version}"
    implementation "org.commonmark:commonmark-ext-gfm-strikethrough:${project.commonmark_version}"
    implementation "org.commonmark:commonmark-ext-task-list-items:${project.commonmark_version}"
    implementation "org.yaml:snakeyaml:${project.snakeyaml_version}"

    shadowBundle "org.commonmark:commonmark:${project.commonmark_version}"
    shadowBundle "org.commonmark:commonmark-ext-gfm-tables:${project.commonmark_version}"
    shadowBundle "org.commonmark:commonmark-ext-gfm-strikethrough:${project.commonmark_version}"
    shadowBundle "org.commonmark:commonmark-ext-task-list-items:${project.commonmark_version}"
    shadowBundle "org.yaml:snakeyaml:${project.snakeyaml_version}"
}

shadowJar {
    // Makes the shipped jar runnable for authors: java -jar opus.jar <book-or-pack-folder>
    manifest {
        attributes 'Main-Class': 'com.chimericdream.opus.core.tools.ValidateBook'
    }
    relocate 'org.commonmark', 'com.chimericdream.opus.shadow.commonmark'
    relocate 'org.yaml.snakeyaml', 'com.chimericdream.opus.shadow.snakeyaml'
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
}
