import org.gradle.jvm.tasks.Jar

plugins {
    id 'com.gradleup.shadow'
}

architectury {
    neoForge()
}

loom {
    accessWidenerPath = project(":opus:common").loom.accessWidenerPath

    neoForge {
        convertAccessWideners(tasks.named("shadowJar", Jar), "opus.accesswidener")
    }
}

configurations {
    developmentNeoForge.extendsFrom common
}

dependencies {
    common(project(path: ':opus:common')) { transitive false }
    shadowBundle project(path: ':opus:common', configuration: 'transformProductionNeoForge')
}

// UNVERIFIED (written without network access to the Gradle plugin/Maven hosts): bundles the Markdown/YAML
// parsers into the shipped jar, relocated so they cannot clash with another mod bundling its own copy.
repositories {
    mavenCentral()
}

dependencies {
    // forgeRuntimeLibrary puts plain (non-mod) jars where NeoForge's dev-environment module layer can see
    // them; the root build.gradle does the same for the quiltmc json parsers YACL needs.
    forgeRuntimeLibrary(implementation("org.commonmark:commonmark:${project.commonmark_version}"))
    forgeRuntimeLibrary(implementation("org.commonmark:commonmark-ext-gfm-tables:${project.commonmark_version}"))
    forgeRuntimeLibrary(implementation("org.commonmark:commonmark-ext-gfm-strikethrough:${project.commonmark_version}"))
    forgeRuntimeLibrary(implementation("org.commonmark:commonmark-ext-task-list-items:${project.commonmark_version}"))
    forgeRuntimeLibrary(implementation("org.yaml:snakeyaml:${project.snakeyaml_version}"))

    shadowBundle "org.commonmark:commonmark:${project.commonmark_version}"
    shadowBundle "org.commonmark:commonmark-ext-gfm-tables:${project.commonmark_version}"
    shadowBundle "org.commonmark:commonmark-ext-gfm-strikethrough:${project.commonmark_version}"
    shadowBundle "org.commonmark:commonmark-ext-task-list-items:${project.commonmark_version}"
    shadowBundle "org.yaml:snakeyaml:${project.snakeyaml_version}"
}

shadowJar {
    relocate 'org.commonmark', 'com.chimericdream.opus.shadow.commonmark'
    relocate 'org.yaml.snakeyaml', 'com.chimericdream.opus.shadow.snakeyaml'
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
}
