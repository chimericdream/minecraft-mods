architectury {
    fabric()
}

loom {
    accessWidenerPath = project(":better-target-dummies:common").loom.accessWidenerPath
}

configurations {
    developmentFabric.extendsFrom common
}

def opusProps = new Properties()
rootProject.file('opus/gradle.properties').withReader { opusProps.load(it) }
def opusVersion = "${rootProject.minecraft_compatibility}-${opusProps.getProperty('mod_version')}"

dependencies {
    common(project(path: ':better-target-dummies:common')) { transitive false }

    // The guide book is Opus data and Opus is an optional dependency, so it is only on the dev runtime classpath. It is
    // wired as a built jar rather than project(): referencing :opus:common from here evaluates it too early.
    runtimeOnly files("${rootDir}/opus/fabric/build/libs/opus-fabric-${opusVersion}.jar") {
        builtBy ':opus:fabric:shadowJar'
    }
    shadowBundle project(path: ':better-target-dummies:common', configuration: 'transformProductionFabric')
}
