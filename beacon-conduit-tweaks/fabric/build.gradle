architectury {
    fabric()
}

loom {
    accessWidenerPath = project(":beacon-conduit-tweaks:common").loom.accessWidenerPath
}

configurations {
    developmentFabric.extendsFrom common
}

def opusProps = new Properties()
rootProject.file('opus/gradle.properties').withReader { opusProps.load(it) }
def opusVersion = "${rootProject.minecraft_compatibility}-${opusProps.getProperty('mod_version')}"

dependencies {
    common(project(path: ':beacon-conduit-tweaks:common')) { transitive false }

    // The guide book is Opus data, so Opus is only needed at runtime (the jars declare the dependency). It is
    // wired as a built jar rather than project(): referencing :opus:common from here evaluates it too early.
    runtimeOnly files("${rootDir}/opus/fabric/build/libs/opus-fabric-${opusVersion}.jar") {
        builtBy ':opus:fabric:shadowJar'
    }
    shadowBundle project(path: ':beacon-conduit-tweaks:common', configuration: 'transformProductionFabric')
}
